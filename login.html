<!DOCTYPE html>
<html lang="es" class="su-passwordless-auth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,follow">
  <title>Iniciar sesión - Sucesso</title>
  <link rel="icon" href="images/sucesso fav icon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth-passwordless.css">
  <script src="bcv-rate.js"></script>
  <script src="checkout-return.js"></script>
  <script src="country-settings.js" defer></script>
  <script type="module" src="auth-passwordless.js"></script>
</head>
<body class="su-passwordless-auth">
  <div class="loader" id="loader" aria-hidden="true">
    <img src="images/logo cherry png.png" alt="">
  </div>

  <main class="su-auth-screen" aria-labelledby="authTitle">
    <a class="su-auth-brand" href="index.html" aria-label="Sucesso">
      <img src="images/logo cherry png.png" alt="Sucesso">
    </a>

    <section class="su-auth-center" aria-live="polite">
      <div class="su-auth-stage">
        <div class="su-auth-step" id="authEmailStep">
          <h1 class="su-auth-title" id="authTitle" data-i18n="passwordless_title">Iniciar sesión</h1>
          <p class="su-auth-subtitle" data-i18n="passwordless_subtitle">Inicia sesión o crea una cuenta</p>

          <button class="su-auth-google" id="authGoogle" type="button" aria-label="Continuar con Google">
            <svg class="su-auth-google-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.2-2.27H12v4.3h6.45a5.51 5.51 0 0 1-2.39 3.61v3h3.87c2.27-2.09 3.56-5.17 3.56-8.64Z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.93-2.9l-3.87-3a7.18 7.18 0 0 1-10.69-3.78H1.38v3.09A12 12 0 0 0 12 24Z"/>
              <path fill="#FBBC05" d="M5.37 14.32A7.2 7.2 0 0 1 5 12c0-.81.14-1.59.37-2.32V6.59H1.38A12 12 0 0 0 0 12c0 1.94.46 3.78 1.38 5.41l3.99-3.09Z"/>
              <path fill="#EA4335" d="M12 4.77c1.77 0 3.36.61 4.61 1.8l3.41-3.41A11.48 11.48 0 0 0 12 0 12 12 0 0 0 1.38 6.59l3.99 3.09A7.17 7.17 0 0 1 12 4.77Z"/>
            </svg>
            <span data-i18n="passwordless_google">Continuar con Google</span>
          </button>

          <div class="su-auth-divider" aria-hidden="true">
            <span></span><em data-i18n="passwordless_or">o</em><span></span>
          </div>

          <form id="authEmailForm" novalidate>
            <div class="su-auth-email-field">
              <input id="authEmail" name="email" type="email" autocomplete="email" inputmode="email" spellcheck="false" placeholder=" " required>
              <label for="authEmail" data-i18n="passwordless_email_label">Correo electrónico</label>
              <button class="su-auth-arrow" id="authSend" type="submit" data-i18n-aria="passwordless_continue" aria-label="Continuar">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
            <p id="authEmailMessage" class="su-auth-message" role="status"></p>
          </form>

          <p class="su-auth-terms-line">
            <span data-i18n="passwordless_terms_prefix">Si continúas, aceptas nuestros</span>
            <button class="su-auth-text-button" type="button" id="authTermsTrigger" data-i18n="passwordless_terms_link">Términos del servicio</button>
          </p>
        </div>

        <div class="su-auth-step" id="authCodeStep" hidden>
          <h1 class="su-auth-title" data-i18n="passwordless_code_title">Introducir código</h1>
          <div class="su-auth-code-meta">
            <span><span data-i18n="passwordless_sent_to">Enviado a</span> <strong id="authSentEmail"></strong></span>
            <button class="su-auth-change" id="authChangeEmail" type="button" data-i18n="passwordless_change">Cambiar</button>
          </div>
          <div class="su-auth-code-grid" id="authCodeGrid" aria-label="Código de verificación">
            <input class="su-auth-code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Dígito 1">
            <input class="su-auth-code-input" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 2">
            <input class="su-auth-code-input" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 3">
            <input class="su-auth-code-input" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 4">
            <input class="su-auth-code-input" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 5">
            <input class="su-auth-code-input" type="text" inputmode="numeric" maxlength="1" aria-label="Dígito 6">
          </div>
          <p id="authCodeMessage" class="su-auth-message" role="status"></p>
          <div class="su-auth-code-actions">
            <button type="button" class="su-auth-resend" id="authResend" hidden>Reenviar código</button>
            <span id="authResendCountdown"></span>
          </div>
        </div>
      </div>
    </section>

    <button type="button" class="su-auth-privacy" id="authPrivacyTrigger" data-i18n="footer_privacy_policy">Política de privacidad</button>
  </main>

  <div class="su-legal-modal" id="authLegalModal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="authLegalTitle">
    <article class="su-legal-card">
      <header class="su-legal-head">
        <h2 id="authLegalTitle">Términos del servicio</h2>
        <button type="button" class="su-legal-close" id="authLegalClose" aria-label="Cerrar"></button>
      </header>
      <div class="su-legal-scroll" id="authLegalBody"></div>
    </article>
  </div>
</body>
</html>
